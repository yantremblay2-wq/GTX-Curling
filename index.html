<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GTX Tracker">
<meta name="theme-color" content="#E4ECF1">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>GTX Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E4ECF1;--surface:#F8FBFC;--glass:rgba(248,251,252,.88);--line:#C9D6DF;--ink:#13263B;--muted:#56687A;
  --blue:#2B66A8;--red:#C3343B;--board:#B7C4CE;
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#0D1722;--surface:#162332;--glass:rgba(22,35,50,.9);--line:#2A3B4E;--ink:#E5EDF3;--muted:#95A7B7;--blue:#74A6DC;--red:#E26870;--board:#24364A}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.full{position:fixed;inset:0;overflow:hidden;padding:0}
#app{max-width:680px;margin:0 auto;padding:10px 14px 40px}
body.full #app{max-width:none;padding:0}
h1,h2,h3{font-family:var(--cond);font-weight:700;margin:0;line-height:1.05}
h1{font-size:2.6rem}
h2{font-size:1.7rem}
h3{font-size:1.3rem;margin:22px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-bottom:8px}
.top h2{flex:1;text-align:center}
.link{border:0;background:none;color:var(--blue);padding:10px 4px;font-weight:600;min-width:64px;text-align:left}
.link.r{text-align:right}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-weight:600;text-align:left}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center}
.btn.primary small{color:inherit;opacity:.75}
.btn.danger{color:var(--red)}
.btn.c{text-align:center}
.stack>*+*{margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.scroll{overflow-x:auto}
.seg.scroll button{flex:0 0 auto;min-width:46px}
label.f{display:block;margin:14px 0 5px;font-size:.85rem;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=checkbox]{width:auto;margin-right:8px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--blue);margin:12px 0 4px}

/* Accueil */
.hero{display:flex;align-items:center;gap:16px;margin:26px 0 26px}
.hero svg{width:84px;height:84px;flex:none}

/* Équipes */
.colors{display:flex;gap:10px}
.chip{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.chip.on{border-color:var(--ink)}
.player{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;margin-top:10px}
.player .ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--cond);font-weight:600;font-size:1.15rem;margin-bottom:8px}
.player .ph button{border:0;background:none;color:var(--red);font-family:var(--sans);font-size:.85rem;font-weight:600}
.picker-wrap{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.picker{width:150px;height:330px;flex:none;border-radius:10px;background:var(--board);touch-action:manipulation;cursor:crosshair}
.group-title{font-family:var(--cond);font-size:1.15rem;font-weight:600;color:var(--muted);margin:20px 0 6px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}

/* Réglages */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.sw:first-child{border-top:0}
.sw span{flex:1}
.sw small{display:block;color:var(--muted);font-size:.83rem}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;border:0;padding:0;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked{background:var(--blue)}
.sw input:checked::after{left:23px}
.sw .inline{border:0;background:none;padding:2px 0;margin:0;color:var(--blue);font-weight:600;font-size:.83rem;text-decoration:underline;text-underline-offset:3px}

/* Partie, plein écran */
.game{position:fixed;inset:0;background:var(--board)}
.game #ice{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.ov{position:absolute;left:0;right:0;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ov-top{top:0;padding:calc(env(safe-area-inset-top,0px) + 4px) calc(env(safe-area-inset-right,0px) + 8px) 6px calc(env(safe-area-inset-left,0px) + 8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px}
.ov-top .link{min-width:0;padding:8px 6px}
.ov-top .ico{font-size:1.6rem;line-height:1;padding:4px 8px;min-width:36px;text-align:center}
.ov-top .ico[data-act=menu]{font-size:1rem;letter-spacing:1px}
.ov-bot{bottom:0;padding:10px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 12px);border-top:1px solid var(--line);max-height:64%;overflow-y:auto}
.ov-bot .inner{max-width:560px;margin:0 auto}
.refit{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:300px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px;padding:7px 13px;font-size:.85rem;font-weight:600;color:var(--ink)}
.sb{flex:1;display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px;min-width:0}
.sb.train{grid-template-columns:1fr auto}
.sb .t{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:.9rem}
.sb .t.r{flex-direction:row-reverse;text-align:right}
.sb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
.sb .nm em{display:block;font-style:normal;font-size:.68rem;color:var(--muted);font-weight:500}
.sb b{font-family:var(--cond);font-size:1.8rem;line-height:1}
.sb .mid{text-align:center;font-family:var(--cond);font-weight:600;font-size:1rem;line-height:1.05}
.sb .mid small{display:block;font-family:var(--sans);font-weight:400;font-size:.68rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.who .num{font-family:var(--cond);font-weight:700;font-size:1.25rem;white-space:nowrap}
.who select{flex:1;min-width:0;padding:7px 10px}
.ov-bot .seg button{padding:8px 6px}
.ov-bot .btn{padding:11px 14px}
.steps{display:flex;gap:6px;margin:10px 0 2px}
.steps span{flex:1;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:3px}
.steps span.on{color:var(--blue);border-color:var(--blue);font-weight:700}
.steps span.done{color:var(--ink);border-color:var(--ink)}
.hint{margin:7px 0 9px;font-size:.92rem;display:flex;gap:8px;align-items:center}
.hint svg{width:26px;height:26px;flex:none}
.hint.ice{background:rgba(43,102,168,.1);border-radius:10px;padding:8px 10px}
.hint b{font-weight:700}
@keyframes nextPulse{0%,100%{box-shadow:0 0 0 0 rgba(43,102,168,.55)}50%{box-shadow:0 0 0 7px rgba(43,102,168,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.next{outline:2px solid var(--blue);outline-offset:2px;border-radius:12px;animation:nextPulse 1.6s ease-in-out infinite}
.shake{animation:shake .3s ease-in-out 2}
@media (prefers-reduced-motion:reduce){.next,.shake{animation:none}}
.chrono{display:flex;gap:8px;margin:0 0 8px}
.chrono .btn{flex:1.4;text-align:center}
.chrono .btn.run{background:var(--red);border-color:var(--red);color:#fff;font-variant-numeric:tabular-nums}
.chrono input{flex:1;text-align:center;padding:8px}
.notes{display:flex;gap:6px;align-items:center;margin:0 0 8px}
.notes>span{font-size:.85rem;font-weight:600;color:var(--muted);margin-right:2px}
.notes button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;font-family:var(--cond);font-size:1.35rem;font-weight:700}
.seg .auto{font-size:.7rem;font-weight:500;opacity:.75}
.notes button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card h3{margin:0 0 4px}
.card .btn{margin-top:8px}
.menu{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;font-weight:600;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--red)}

.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;border-top:6px solid var(--tc)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 6px}
.phead h2{font-size:2.3rem;margin:2px 0}
.ppos{font-family:var(--cond);font-weight:600;font-size:1.05rem;color:var(--muted)}
.pmeta{font-size:.85rem;color:var(--muted)}
.gauge{width:104px;height:104px;flex:none;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.tile{background:var(--surface);padding:10px 14px}
.tile b{display:block;font-family:var(--cond);font-size:1.6rem;line-height:1.1}
.tile span{font-size:.8rem;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:420px){.duo{grid-template-columns:1fr}}
.sec{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.duo .sec{margin-top:0}
.sec h3{margin:0 0 6px}
.pts{list-style:none;margin:0;padding:0}
.pts li{padding:6px 0 6px 22px;position:relative;border-top:1px solid var(--line);font-size:.92rem}
.pts li:first-child{border-top:0}
.pts li::before{position:absolute;left:0;top:5px;font-weight:700}
.pts.plus li::before{content:"+";color:#2F8F5B}
.pts.minus li::before{content:"–";color:var(--red)}
.scatter{display:block;width:100%;max-width:330px;margin:6px auto 0}
.prog{display:block;width:100%;margin-top:4px}
.bars{display:grid;gap:7px;margin-top:4px}
.bar{display:grid;grid-template-columns:76px 1fr 46px 50px;gap:8px;align-items:center;font-size:.88rem;font-variant-numeric:tabular-nums}
.bar.head{font-size:.75rem;color:var(--muted)}
.bar.head .bt{background:none}
.bt{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--tc,var(--blue));border-radius:5px}
.bv{text-align:right;font-weight:600}.bn{text-align:right;color:var(--muted)}

/* Historique */
.sheet-wrap{position:relative;margin-top:10px;background:var(--board);border-radius:16px;overflow:hidden;height:min(56vh,118vw)}
.sheet-wrap svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.sheet-wrap .refit{bottom:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
ol.shots{list-style:none;margin:0;padding:0}
ol.shots li{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
ol.shots li.on{background:var(--surface);border-radius:10px}
ol.shots .n{font-family:var(--cond);font-weight:700;font-size:1.2rem;width:22px;flex:none}
ol.shots .dot{margin-top:4px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:76px}
.info b{font-family:var(--cond);font-size:1.2rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend svg{width:20px;height:20px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast,.sw input,.sw input::after{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- Dimensions de la glace (cm) ----------
   x : distance de la ligne centrale (+ à droite vu du lanceur)
   y : distance de la tee line (+ vers la hog line) */
const HOG=640.1, BACK=-182.9, W2=237.5, R=14.5, HOUSE=182.9, HACK=1006, TOL=5;
const HOUSE_FIT={x0:-238,x1:238,y0:-198,y1:250};
const POS=['Premier','Deuxième','Troisième','Skip','Substitut'];
const COLORS=[['Rouge','#C8343B'],['Jaune','#E8B923'],['Bleu','#2E6FB7'],['Vert','#2F8F5B'],['Noir','#2A2F35']];
const TYPES=[['placement','Placement'],['garde','Garde'],['sortie','Take-out']];
const typeLabel=t=>t?(TYPES.find(x=>x[0]===t)||[0,t])[1]:'Lancer';
const TURNS=[['in','In-turn'],['out','Out-turn']];
const turnLabel=t=>(TURNS.find(x=>x[0]===t)||[0,''])[1];
const ROT_METHOD={hog:'hog à hog',lacher:'du lâcher à l’arrêt'};
const PRACTICE='#A7B0B7';
const DB_KEY='suiviCurling.v1';
const DEFAULT_SETTINGS={types:true,broom:true,want:true,chrono:true,note:true,rot:false,rotMethod:'hog'};

/* ---------- Données ---------- */
let db=load();
function load(){
  let d={};try{const t=localStorage.getItem(DB_KEY);if(t)d=JSON.parse(t)||{}}catch(e){}
  return{teams:d.teams||[],games:d.games||[],currentId:d.currentId||null,settings:{...DEFAULT_SETTINGS,...(d.settings||{})}};
}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){toast('Sauvegarde impossible sur cet appareil')}}

/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const r1=n=>Math.round(n*10)/10;
const r5=n=>Math.round(n/5)*5;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr=(n,d=1)=>n==null||!isFinite(n)?'–':n.toFixed(d).replace('.',',');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const parseNum=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const fmtDate=iso=>new Date(iso).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
const pName=(p,i)=>p.name&&p.name.trim()?p.name.trim():POS[i]||'Joueur';
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300)}

/* ---------- Règles ---------- */
function inPlay(s){return Math.abs(s.x)+R<W2 && s.y+R>=BACK && s.y+R<=HOG}
function inHouse(s){return Math.hypot(s.x,s.y)<=HOUSE+R}
const sameSpot=(stones,ref)=>{const s=stones.find(x=>x.id===ref.id);return !!s&&Math.abs(s.x-ref.x)<.5&&Math.abs(s.y-ref.y)<.5};
const validM=(m,stones)=>sameSpot(stones,m.closer)&&sameSpot(stones,m.farther);
/* Pierres dans la maison, de la plus proche du bouton à la plus loin, en tenant compte des mesures faites */
function ranked(stones,measures=[]){
  const l=stones.filter(s=>s.team!=='X'&&inHouse(s)).map(s=>({...s,d:Math.hypot(s.x,s.y)})).sort((a,b)=>a.d-b.d);
  const ms=measures.filter(m=>validM(m,stones));
  for(let k=0;k<l.length;k++)for(let i=0;i<l.length-1;i++)if(ms.some(m=>m.closer.id===l[i+1].id&&m.farther.id===l[i].id))[l[i],l[i+1]]=[l[i+1],l[i]];
  return l;
}
/* Égalité qui décide du pointage : la première pierre adverse contre la dernière pierre qui compte */
function firstTie(stones,measures=[]){
  const l=ranked(stones,measures);if(l.length<2)return null;
  const i=l.findIndex(s=>s.team!==l[0].team);if(i<1)return null;
  const a=l[i-1],b=l[i];if(Math.abs(a.d-b.d)>=TOL)return null;
  if(measures.some(m=>validM(m,stones)&&((m.closer.id===a.id&&m.farther.id===b.id)||(m.closer.id===b.id&&m.farther.id===a.id))))return null;
  return{a,b,rank:i};
}
function scoreEnd(stones,measures=[]){
  const h=ranked(stones,measures);if(!h.length)return{team:null,pts:0};
  const t=h[0].team;let p=0;for(const s of h){if(s.team!==t)break;p++}
  return{team:t,pts:p};
}
function diff(before,after){
  const removed=[],moved=[];
  for(const b of before){const a=after.find(s=>s.id===b.id);if(!a)removed.push(b.team);else if(Math.hypot(a.x-b.x,a.y-b.y)>5)moved.push(b.team)}
  return{removed,moved};
}
const sortieOk=s=>s.removed.some(t=>t!==s.team);
function resultText(s,g){
  const parts=[];const adv=g.mode==='competition';
  if(!s.final)parts.push('Pierre lancée hors jeu');
  const o=s.removed.filter(t=>t!==s.team).length,w=s.removed.filter(t=>t===s.team).length,m=s.moved.length;
  if(o)parts.push(o>1?`${o} pierres${adv?' adverses':''} sorties`:`1 pierre${adv?' adverse':''} sortie`);
  if(w)parts.push(w>1?`${w} pierres de l’équipe sorties`:'1 pierre de l’équipe sortie');
  if(m)parts.push(m>1?`${m} pierres déplacées`:'1 pierre déplacée');
  return parts.join(', ');
}

/* ---------- Partie ---------- */
const curGame=()=>db.games.find(g=>g.id===db.currentId&&!g.finished);
const lastEnd=g=>g.ends[g.ends.length-1];
const maxStones=g=>g.mode==='competition'?16:8;
const colorOf=(g,t)=>t==='X'?PRACTICE:(g[t]?g[t].color:PRACTICE);
const currentStones=e=>e.shots.length?clone(e.shots[e.shots.length-1].after):[];

function nextThrow(g,e){
  const k=e.shots.length;let team,ti;
  if(g.mode!=='competition'){team='A';ti=k}
  else{const first=e.hammer==='A'?'B':'A';team=k%2===0?first:(first==='A'?'B':'A');ti=Math.floor(k/2)}
  if(ti%2===1){const prev=[...e.shots].reverse().find(s=>s.team===team);if(prev)return{team,playerId:prev.playerId}}
  const ps=g[team].players;const p=ps[Math.min(Math.floor(ti/2),Math.min(3,ps.length-1))];
  return{team,playerId:p?p.id:null};
}

/* Caméra : pincer à deux doigts pour zoomer et déplacer, un doigt pour toucher ou glisser une pierre */
function makeIce(svg,opt){
  const st=opt.cam,ptrs=new Map();let g=null;
  const size=()=>{const r=svg.getBoundingClientRect();return{W:r.width,H:r.height,r}};
  function apply(){const{W,H}=size();if(!W||!H||!st.s)return;const w=W/st.s,h=H/st.s;
    /* La glace ne glisse pas de côté : centrée quand elle remplit la largeur, bornée à ses bords quand on zoome */
    st.cx=w>=2*W2?0:Math.max(-W2+w/2,Math.min(W2-w/2,st.cx));
    const ins=opt.insets?opt.insets():{t:0,b:0},lo=BACK-15+h/2-ins.t/st.s,hi=HOG+40-h/2+ins.b/st.s;
    st.cy=hi<lo?lo:Math.max(lo,Math.min(hi,st.cy));svg.setAttribute('viewBox',`${r1(st.cx-w/2)} ${r1(st.cy-h/2)} ${r1(w)} ${r1(h)}`)}
  function fit(){
    const{W,H}=size();if(!W||!H)return;const ins=opt.insets?opt.insets():{t:0,b:0};const reg=opt.region;
    const fh=Math.max(120,H-ins.t-ins.b);
    st.s=clampS(fitScale());st.cx=(reg.x0+reg.x1)/2;st.cy=(reg.y0+reg.y1)/2-((ins.t+fh/2)-H/2)/st.s;st.set=true;apply();
  }
  const world=(cx,cy)=>{const{W,H,r}=size();return{x:st.cx+(cx-r.left-W/2)/st.s,y:st.cy+(cy-r.top-H/2)/st.s}};
  /* Zoom arrière : jamais plus loin que la largeur de la glace */
  function fitScale(){const{W,H}=size();const ins=opt.insets?opt.insets():{t:0,b:0};const reg=opt.region;
    const fh=Math.max(120,H-ins.t-ins.b);return Math.min(W/(reg.x1-reg.x0),fh/(reg.y1-reg.y0))}
  const clampS=s=>{const{W}=size();return Math.min(14,Math.max(W/(2*W2+1),s))};
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){const p=world(e.clientX,e.clientY);const drag=opt.onDown?opt.onDown(p):false;g={mode:'one',sx:e.clientX,sy:e.clientY,moved:false,drag,pan:!drag&&!!(opt.pan&&opt.pan()),cx:st.cx,cy:st.cy}}
    else if(ptrs.size===2){if(g&&g.drag&&opt.onCancel)opt.onCancel();const[a,b]=[...ptrs.values()];
      g={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,w:world((a.x+b.x)/2,(a.y+b.y)/2),s:st.s}}
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)||!g)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(g.mode==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const{W,H,r}=size();const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      st.s=clampS(g.s*Math.hypot(a.x-b.x,a.y-b.y)/g.d);st.cx=g.w.x-(mx-r.left-W/2)/st.s;st.cy=g.w.y-(my-r.top-H/2)/st.s;apply()}
    else if(g.mode==='one'){
      if(Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>8)g.moved=true;
      if(!g.moved)return;
      if(g.drag)opt.onMove&&opt.onMove(world(e.clientX,e.clientY));
      else if(g.pan){st.cx=g.cx-(e.clientX-g.sx)/st.s;st.cy=g.cy-(e.clientY-g.sy)/st.s;apply()}
    }
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!g)return;
    if(g.mode==='one'){const p=world(e.clientX,e.clientY);
      if(g.drag){if(e.type==='pointercancel'&&opt.onCancel)opt.onCancel();else opt.onUp&&opt.onUp(p,g.moved)}
      else if(!g.moved&&e.type==='pointerup')opt.onTap&&opt.onTap(p);
      g=null}
    else if(g.mode==='pinch'&&ptrs.size===0)g=null;
  };
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();const w=world(e.clientX,e.clientY);const{W,H,r}=size();
    st.s=clampS(st.s*Math.exp(-e.deltaY*.0018));st.cx=w.x-(e.clientX-r.left-W/2)/st.s;st.cy=w.y-(e.clientY-r.top-H/2)/st.s;apply()},{passive:false});
  return{fit,apply};
}

function endPanel(g,e){

const hitStone=(stones,p,list)=>{let best=null,bd=R*1.9;for(const s of list||stones){const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=s}}return best};
let dragS=null;
/* Deux pierres ne peuvent pas se chevaucher : la pierre posée glisse juste à côté, collée à l'autre */
function separate(s,others){
  for(let k=0;k<12;k++){let moved=false;
    for(const o of others){if(o.id===s.id)continue;let dx=s.x-o.x,dy=s.y-o.y,d=Math.hypot(dx,dy);
      if(d<2*R-.05){if(d<.01){dx=0;dy=1;d=1}const f=(2*R)/d;s.x=r1(o.x+dx*f);s.y=r1(o.y+dy*f);moved=true}}
    if(!moved)break}
  return s;
}
function gameTap(p){
  const g=curGame();if(!g)return;const e=lastEnd(g);
  if(ui.menu){ui.menu=false;renderPanel();return}
  const pt={x:r1(p.x),y:r1(p.y)};
  if(!shotMode()){
    if(e.score||g.mode!=='competition')return;
    const st=currentStones(e);e.measures=e.measures||[];const tie=firstTie(st,e.measures);if(!tie)return;
    const hit=hitStone(st,p,[tie.a,tie.b]);if(!hit)return toast('Touchez une des deux pierres encerclées');
    const other=hit.id===tie.a.id?tie.b:tie.a;const ref=s=>({id:s.id,x:s.x,y:s.y});
    e.measures.push({closer:ref(hit),farther:ref(other)});save();drawDyn();renderPanel();return;
  }
  if(ui.practice){const s=separate({id:'x'+uid(),team:'X',...pt},ui.stones);if(!inPlay(s))return toast('Placez la pierre sur la glace');ui.stones.push(s);ui.before.push(clone(s));ui.practice=false;drawDyn();renderPanel();return}
  if(ui.step==='type'){toast('Choisissez d’abord le type de lancer');const t=$('[aria-label="Type de lancer"]');if(t){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}return}
  if(ui.step==='brosse'){ui.broom=pt;nextStep()}
  else if(ui.step==='voulue'){ui.want=pt;autoTurn();nextStep()}
  else if(ui.step==='arret'){const s=separate({id:'t'+uid(),team:ui.team,...pt},ui.stones);if(inPlay(s)){ui.stones.push(s);ui.thrownId=s.id}else toast('Pierre hors jeu');ui.step='ajuster'}

}
function gameDown(p){

  const s=hitStone(ui.stones,p);if(!s)return false;

}
function gameMove(p){const s=dragS&&ui.stones.find(x=>x.id===dragS.id);if(!s)return;s.x=r1(p.x+dragS.dx);s.y=r1(p.y+dragS.dy);drawDyn()}
function gameUp(p,moved){
  const s=dragS&&ui.stones.find(x=>x.id===dragS.id);dragS=null;if(!s)return;
  if(moved){if(inPlay(s))separate(s,ui.stones);if(!inPlay(s)){ui.stones=ui.stones.filter(x=>x.id!==s.id);if(ui.selected===s.id)ui.selected=null;toast('Pierre retirée du jeu')}}

function gameCancel(){const s=dragS&&ui.stones.find(x=>x.id===dragS.id);if(s){s.x=dragS.x;s.y=dragS.y}dragS=null;drawDyn()}
function validateShot(){
  const g=curGame(),e=lastEnd(g);
  const th=ui.stones.find(s=>s.id===ui.thrownId)||null;
  const after=clone(ui.stones),before=clone(ui.before);
  const {removed,moved}=diff(before,after);
  const pi=g[ui.team].players.findIndex(p=>p.id===ui.playerId);const p=g[ui.team].players[pi]||{id:null,name:''};
  const final=th?{x:th.x,y:th.y}:null;
  const ecart=ui.want&&final&&ui.type!=='sortie'?Math.round(Math.hypot(final.x-ui.want.x,final.y-ui.want.y)):null;
  e.shots.push({n:e.shots.length+1,team:ui.team,playerId:p.id,playerName:pName(p,Math.max(pi,0)),type:ui.type,broom:ui.broom,target:ui.want,hogTime:parseNum(ui.hog),note:ui.note,turn:db.settings.rot?ui.turn:null,rot:db.settings.rot?ui.rot:null,rotMethod:db.settings.rot&&ui.rot!=null?db.settings.rotMethod:null,final,before,after,removed,moved,ecart,release:releaseOf(p),t:Date.now()});

function undo(){

}

${S.length?`<div class="tablewrap"><table><tr><th>Joueur</th><th>Lancers</th>${hasNote?'<th>Pourcentage</th>':''}${hasEc?'<th>Écart moyen</th>':''}${hasHog?'<th>Hog à hog</th>':''}${hasRot?'<th>Tours</th>':''}${hasTO?'<th>Take-outs</th>':''}</tr>
${S.map(r=>`<tr><td><i class="dot" style="background:${colorOf(g,r.team)};vertical-align:-2px;margin-right:6px"></i>${esc(r.name)}</td><td>${r.n}</td>${hasNote?`<td>${r.notes.length?Math.round(avg(r.notes)/4*100)+' %':'–'}</td>`:''}${hasEc?`<td>${r.ec.length?Math.round(avg(r.ec))+' cm':'–'}</td>`:''}${hasHog?`<td>${r.hog.length?fr(avg(r.hog),2)+' s':'–'}</td>`:''}${hasRot?`<td>${r.rots.length?fr(avg(r.rots),1):'–'}</td>`:''}${hasTO?`<td>${r.st?`${r.so} sur ${r.st}`:'–'}</td>`:''}</tr>`).join('')}</table></div>
<p class="muted small">Le pourcentage suit la méthode officielle : la somme des notes divisée par 4 fois le nombre de lancers notés. L’écart moyen compare la position voulue et la position finale, sauf pour les take-outs.</p>`:'<div class="empty">Aucun lancer noté dans cette partie.</div>'}
<div class="stack" style="margin-top:18px"><button class="btn c" data-act="exportCsv">Exporter cette partie (CSV)</button><button class="btn danger c" data-act="delGame">Supprimer la partie</button></div>`;
  ice=makeIce($('#rpice'),{cam:rpCam,region:HOUSE_FIT,pan:()=>true});

function drawReplay(){
  const g=db.games.find(x=>x.id===rp.id),e=g.ends[rp.end]||g.ends[0],k=rp.k;
  const s=k>0?e.shots[k-1]:null;const stones=s?s.after:(e.shots[0]?e.shots[0].before:[]);
  const thrownId=s&&s.final?(s.after.find(x=>x.x===s.final.x&&x.y===s.final.y)||{}).id:null;
  const ms=k===e.shots.length?(e.measures||[]):[];
  let h='';
  if(s&&s.target&&s.final)h+=lineSVG(s.target,s.final);
  h+=stones.map(x=>stoneSVG(x,colorOf(g,x.team),{thrown:x.id===thrownId})).join('');
  ranked(stones,ms).forEach((x,i)=>h+=rankSVG(x,i+1));
  if(s&&s.broom)h+=broomSVG(s.broom);
  if(s&&s.target)h+=targetSVG(s.target);
  $('#rpdyn').innerHTML=h;
  const info=$('#rpInfo');
  if(!s)info.innerHTML=`<b>Début du bout ${e.n}</b><p class="muted small">Glissez le curseur ou touchez un lancer pour le revoir. Deux doigts pour zoomer sur la glace.</p>`;
  else{const sc=k===e.shots.length&&e.score;info.innerHTML=`<b>Pierre ${s.n} : ${esc(s.playerName)}</b><p class="small">${typeLabel(s.type)}${s.turn?`, ${turnLabel(s.turn).toLowerCase()}`:''}${s.rot!=null?`, ${fr(s.rot,s.rot%1?1:0)} tours (${ROT_METHOD[s.rotMethod]||'hog à hog'})`:''}${s.note!=null?`, note ${s.note} sur 4`:''}${s.hogTime!=null?`, hog à hog ${fr(s.hogTime,2)} s`:''}${s.ecart!=null?`, écart de ${s.ecart} cm avec la position voulue`:''}</p><p class="muted small">${resultText(s,g)||'Aucune autre pierre touchée'}${sc&&g.mode==='competition'?`. Fin du bout : ${sc.pts?esc(g[sc.team].name)+' marque '+sc.pts:'bout nul'}`:''}</p>`}
  document.querySelectorAll('ol.shots li').forEach(li=>li.classList.toggle('on',+li.dataset.v===k));
}
function stats(g){
  const m=new Map();
  for(const e of g.ends)for(const s of e.shots){const key=s.team+'|'+s.playerId+'|'+s.playerName;let r=m.get(key);
    if(!r){r={team:s.team,name:s.playerName,n:0,ec:[],hog:[],notes:[],rots:[],st:0,so:0};m.set(key,r)}
    r.n++;if(s.ecart!=null)r.ec.push(s.ecart);if(s.hogTime!=null)r.hog.push(s.hogTime);if(s.note!=null)r.notes.push(s.note);if(s.rot!=null)r.rots.push(s.rot);
    if(s.type==='sortie'){r.st++;if(sortieOk(s))r.so++}}
  return[...m.values()].sort((a,b)=>a.team.localeCompare(b.team));
}

/* --- Carte du joueur --- */
function playerShots(pid){const out=[];for(const g of db.games)for(const e of g.ends)for(const s of e.shots)if(s.playerId===pid)out.push({g,e,s});return out}
const pctOf=a=>a.length?Math.round(avg(a)/4*100):null;
const sd=a=>{if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
function analyse(pid){
  const L=playerShots(pid),S=L.map(x=>x.s);
  const rated=f=>S.filter(s=>f(s)&&s.note!=null).map(s=>s.note);
  const byType=TYPES.map(([k,l])=>({k,l,count:S.filter(s=>s.type===k).length,notes:rated(s=>s.type===k)}));
  const byTurn=TURNS.map(([k,l])=>({k,l,count:S.filter(s=>s.turn===k).length,notes:rated(s=>s.turn===k)}));
  const offs=S.filter(s=>s.target&&s.final&&s.type!=='sortie').map(s=>({dx:s.final.x-s.target.x,dy:s.final.y-s.target.y}));
  const hog=S.map(s=>s.hogTime).filter(v=>v!=null),rots=S.map(s=>s.rot).filter(v=>v!=null),ec=S.map(s=>s.ecart).filter(v=>v!=null);
  const to=S.filter(s=>s.type==='sortie'),toOk=to.filter(sortieOk).length;
  const gm=new Map();for(const x of L){let r=gm.get(x.g.id);if(!r){r={date:x.g.date,notes:[],opp:x.g.B?(x.s.team==='A'?x.g.B.name:x.g.A.name):null};gm.set(x.g.id,r)}if(x.s.note!=null)r.notes.push(x.s.note)}
  const games=[...gm.values()].sort((a,b)=>a.date.localeCompare(b.date));
  const mean={dx:avg(offs.map(o=>o.dx)),dy:avg(offs.map(o=>o.dy))};
  /* Points forts et points à travailler, seulement avec assez de lancers dans la catégorie */
  const plus=[],minus=[],MIN=3;
  for(const t of byType){const p=pctOf(t.notes);if(t.notes.length<MIN)continue;if(p>=80)plus.push(`${t.l} : ${p} %`);else if(p<=60)minus.push(`${t.l} : ${p} %`)}
  const [ti,tout]=byTurn;
  if(ti.notes.length>=MIN&&tout.notes.length>=MIN){const a=pctOf(ti.notes),b=pctOf(tout.notes);if(Math.abs(a-b)>=10){const[hi,lo,ph,pl]=a>b?['In-turn','Out-turn',a,b]:['Out-turn','In-turn',b,a];plus.push(`${hi} plus fiable (${ph} %)`);minus.push(`${lo} : ${pl} %, ${ph-pl} points sous le ${hi.toLowerCase()}`)}}
  const offOf=f=>S.filter(s=>f(s)&&s.target&&s.final&&s.type!=='sortie').map(s=>({dx:s.final.x-s.target.x,dy:s.final.y-s.target.y}));
  const groups=TURNS.map(([k,l])=>({l:l+' : ',o:offOf(s=>s.turn===k)})).filter(x=>x.o.length>=4);
  if(!groups.length&&offs.length>=4)groups.push({l:'',o:offs});
  let biased=false;
  for(const gr of groups){const dx=avg(gr.o.map(o=>o.dx)),dy=avg(gr.o.map(o=>o.dy));
    if(Math.abs(dy)>=30){biased=true;minus.push(`${gr.l}tendance à arrêter ${dy<0?'long':'court'}, ${Math.round(Math.abs(dy))} cm en moyenne`)}
    if(Math.abs(dx)>=25){biased=true;minus.push(`${gr.l}tendance à finir à ${dx>0?'droite':'gauche'}, ${Math.round(Math.abs(dx))} cm en moyenne`)}}
  if(groups.length&&!biased)plus.push('Aucun biais de direction ni de poids');
  const hs=sd(hog);
  if(hog.length>=4&&hs!=null){if(hs<=.2)plus.push(`Poids constant : ±${fr(hs,2)} s hog à hog`);else if(hs>=.4)minus.push(`Poids irrégulier : ±${fr(hs,2)} s hog à hog`)}
  if(to.length>=MIN&&byType[2].notes.length<MIN){const p=Math.round(toOk/to.length*100);if(p>=75)plus.push(`Take-outs réussis : ${p} %`);else if(p<=50)minus.push(`Take-outs réussis : ${p} %`)}
  return{L,S,byType,byTurn,offs,mean,hog,hs,rots,ec,to,toOk,games,plus,minus,pct:pctOf(S.filter(s=>s.note!=null).map(s=>s.note))};
}
function findPlayer(pid){
  for(const t of db.teams){const i=t.players.findIndex(p=>p.id===pid);if(i>=0)return{t,p:t.players[i],i}}
  const x=playerShots(pid)[0];if(x){const tm=x.g[x.s.team];const i=tm.players.findIndex(p=>p.id===pid);return{t:tm,p:tm.players[i]||{name:x.s.playerName},i}}
  return null;
}
function gaugeSVG(p,color){
  const C=2*Math.PI*44,v=p==null?0:p/100;
  return `<svg viewBox="0 0 112 112" class="gauge" aria-hidden="true"><circle cx="56" cy="56" r="44" fill="none" stroke="var(--line)" stroke-width="11"/>
<circle cx="56" cy="56" r="44" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(C*v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 56 56)"/>
<text x="56" y="62" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="30" fill="currentColor">${p==null?'–':p+' %'}</text></svg>`;
}
function barRows(rows){
  return rows.filter(r=>r.count).map(r=>{const p=pctOf(r.notes);return `<div class="bar"><span class="bl">${r.l}</span><span class="bt"><i style="width:${p??0}%"></i></span><span class="bv">${p==null?'–':p+' %'}</span><span class="bn">${r.count}</span></div>`}).join('');
}
/* Dispersion : la position voulue au centre, chaque point est l'endroit où la pierre s'est arrêtée par rapport à elle */
function scatterSVG(offs,mean,color){
  const pts=offs.map(o=>`<circle cx="${r1(Math.max(-175,Math.min(175,o.dx)))}" cy="${r1(Math.max(-175,Math.min(175,o.dy)))}" r="7" fill="${color}" fill-opacity=".55" stroke="#13263B" stroke-opacity=".5" stroke-width="1"/>`).join('');
  const m=offs.length?`<g transform="translate(${r1(mean.dx)} ${r1(mean.dy)})"><circle r="11" fill="none" stroke="#13263B" stroke-width="3"/><circle r="3" fill="#13263B"/></g>`:'';
  const T=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="15" fill="var(--muted)" font-family="system-ui,sans-serif">${t}</text>`;
  return `<svg viewBox="-200 -200 400 400" class="scatter" aria-label="Dispersion des arrêts autour de la position voulue">
${[30,60,120].map(r=>`<circle r="${r}" fill="none" stroke="var(--line)" stroke-width="2" ${r===120?'':'stroke-dasharray="6 5"'}/><text x="${r1(r*.7071+4)}" y="${r1(-r*.7071-4)}" font-size="13" fill="var(--muted)" font-family="system-ui,sans-serif">${r} cm</text>`).join('')}
<path d="M-190 0H190M0-190V190" stroke="var(--line)" stroke-width="1.5"/>
<g stroke="#13263B" stroke-width="2.4"><circle r="9" fill="none"/></g>
${pts}${m}${T(0,-176,'Long')}${T(0,190,'Court')}${T(-192,-6,'Gauche','start')}${T(192,-6,'Droite','end')}</svg>`;
}
function progressSVG(games,color){
  const G=games.filter(g=>g.notes.length);if(G.length<2)return '';
  const lo=Math.min(50,Math.floor((Math.min(...G.map(g=>pctOf(g.notes)))-5)/10)*10);
  const W=320,H=120,px=i=>44+i*(W-60)/(G.length-1),py=p=>H-18-((p-lo)/(100-lo))*(H-32);
  const pts=G.map((g,i)=>[px(i),py(pctOf(g.notes))]);
  return `<svg viewBox="0 0 ${W} ${H}" class="prog" aria-label="Pourcentage par partie">
${[lo,Math.round((lo+100)/2),100].map(v=>`<line x1="40" x2="${W-8}" y1="${r1(py(v))}" y2="${r1(py(v))}" stroke="var(--line)" stroke-width="1"/><text x="34" y="${r1(py(v)+3.5)}" text-anchor="end" font-size="10" fill="var(--muted)">${v} %</text>`).join('')}
<polyline points="${pts.map(p=>p.map(r1).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>
${pts.map((p,i)=>`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"><title>${fmtDate(G[i].date)} : ${pctOf(G[i].notes)} %</title></circle>`).join('')}
<text x="44" y="${H-3}" font-size="10" fill="var(--muted)">${new Date(G[0].date).toLocaleDateString('fr-CA',{day:'numeric',month:'short'})}</text>
<text x="${W-16}" y="${H-3}" text-anchor="end" font-size="10" fill="var(--muted)">${new Date(G[G.length-1].date).toLocaleDateString('fr-CA',{day:'numeric',month:'short'})}</text></svg>`;
}

/* --- Export / import --- */
async function shareFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(err){if(err&&err.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function csvOf(g){
  const head=['date','mode','evenement','equipe_A','equipe_B','bout','marteau','pierre','equipe','joueur','type','brosse_x_cm','brosse_y_cm','voulue_x_cm','voulue_y_cm','final_x_cm','final_y_cm','ecart_cm','note_0_4','sens','rotations','methode_rotations','hog_a_hog_s','hors_jeu','pierres_sorties_adverses','pierres_sorties_equipe','pierres_deplacees','depart_dist_hog_cm','depart_decalage_cm'];
  const q=v=>{if(v==null)return'';if(typeof v==='number')return String(v).replace('.',',');const s=String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[head.join(';')];
  for(const e of g.ends)for(const s of e.shots){
    rows.push([g.date.slice(0,10),g.mode,g.event,g.A.name,g.B?g.B.name:'',e.n,e.hammer?g[e.hammer].name:'',s.n,g[s.team]?g[s.team].name:s.team,s.playerName,s.type?typeLabel(s.type):'',
      s.broom?.x,s.broom?.y,s.target?.x,s.target?.y,s.final?.x,s.final?.y,s.ecart,s.note,turnLabel(s.turn),s.rot,s.rotMethod?ROT_METHOD[s.rotMethod]:'',s.hogTime,s.final?'non':'oui',
      s.removed.filter(t=>t!==s.team).length,s.removed.filter(t=>t===s.team).length,s.moved.length,s.release?.dist,s.release?.offset].map(q).join(';'));
  }
  return '﻿'+rows.join('\n');
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.games)||!Array.isArray(d.teams))throw 0;
    let nT=0,nG=0;for(const t of d.teams)if(!db.teams.find(x=>x.id===t.id)){db.teams.push(t);nT++}
    for(const g of d.games)if(!db.games.find(x=>x.id===g.id)){db.games.push({...g,finished:true});nG++}
    save();render();toast(`${nG} partie${nG>1?'s':''} et ${nT} équipe${nT>1?'s':''} importées`)}
    catch(e){toast('Ce fichier n’est pas une exportation de GTX Tracker')}};
  r.readAsText(file);
}

  turn:v=>{ui.turn=ui.turn===v&&!ui.turnAuto?null:v;ui.turnAuto=false;renderPanel()},
  rot:v=>{const n=+v,cur=ui.rot;if(cur!=null&&Math.floor(cur)===n)ui.rot=null;else ui.rot=n+(cur!=null&&cur%1!==0?.5:0);renderPanel()},
  rotHalf:()=>{if(ui.rot==null)return toast('Choisissez d’abord le nombre de tours');ui.rot=ui.rot%1!==0?Math.floor(ui.rot):Math.floor(ui.rot)+.5;renderPanel()},
  skip:()=>{if(ui.step==='brosse')ui.broom=null;if(ui.step==='voulue')ui.want=null;autoTurn();ui.practice=false;nextStep();drawDyn();renderPanel()},
  back:()=>{const a=stepsFor(),prev=a[a.indexOf(ui.step)-1];if(!prev)return;if(prev==='brosse')ui.broom=null;if(prev==='voulue')ui.want=null;autoTurn();ui.step=prev;ui.practice=false;drawDyn();renderPanel()},
  practice:()=>{ui.practice=!ui.practice;renderPanel()},
  out:()=>{ui.thrownId=null;ui.practice=false;ui.step='ajuster';drawDyn();renderPanel()},
  note:v=>{ui.note=ui.note===+v?null:+v;renderPanel()},
  removeSel:()=>{ui.stones=ui.stones.filter(s=>s.id!==ui.selected);ui.selected=null;drawDyn();renderPanel();toast('Pierre retirée du jeu')},
  redo:()=>{ui.stones=clone(ui.before);ui.thrownId=null;ui.broom=null;ui.want=null;ui.note=null;ui.selected=null;ui.step=stepsFor()[0];if(ui.type&&ui.step==='type')nextStep();drawDyn();renderPanel()},
  validate:validateShot,
  chrono:toggleChrono,
  menu:()=>{ui.menu=!ui.menu;renderPanel()},
  undo:()=>{ui.menu=false;undo()},
  endNow:()=>{ui.menu=false;ui.forceEnd=true;drawDyn();renderPanel()},
  resume:()=>{ui.forceEnd=false;drawDyn();renderPanel()},
  confirmEnd:()=>{const g=curGame(),e=lastEnd(g);e.score=endScore(g,e);if(g.ends.length<g.endsPlanned)newEnd(g);save();resetShot();renderGame()},
  extraEnd:()=>{const g=curGame();g.endsPlanned=g.ends.length+1;newEnd(g);save();resetShot();renderGame()},
  finishGame:()=>{ui.menu=false;finishGame()},
  openGame:v=>go('replay',v),
  resumeGame:()=>{db.currentId=rp.id;save();ui={};gameCam={set:false};resetShot();go('game')},
  rpEnd:v=>{rp.end=+v;rp.k=null;renderReplay()},
  rpGo:v=>{rp.k=+v;$('input[data-in=rpK]').value=rp.k;drawReplay()},
  exportCsv:()=>{const g=db.games.find(x=>x.id===rp.id);shareFile(`curling-${g.date.slice(0,10)}-${g.A.name.replace(/\W+/g,'-')}.csv`,csvOf(g),'text/csv')},
  exportAll:()=>shareFile(`gtx-tracker-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'gtx-tracker',version:4,exported:new Date().toISOString(),settings:db.settings,teams:db.teams,games:db.games},null,1),'application/json'),
  importData:()=>$('#imp').click(),
  delGame:()=>{if(!confirm('Supprimer définitivement cette partie ?'))return;db.games=db.games.filter(x=>x.id!==rp.id);if(db.currentId===rp.id)db.currentId=null;save();go('history')}
};
const IN={
  tname:el=>edit.name=el.value,
  pname:el=>edit.players[+el.dataset.i].name=el.value,
  ngOppName:el=>ng.oppName=el.value,
  ngEnds:el=>ng.ends=el.value,
  ngEvent:el=>ng.event=el.value,
  hog:el=>ui.hog=el.value,
  rpK:el=>{rp.k=+el.value;drawReplay()}
};
const CH={
  ngTeam:el=>{ng.teamId=el.value;if(ng.oppId===el.value)ng.oppId='';renderNew()},
  ngOpp:el=>{ng.oppId=el.value;renderNew()},
  thrower:el=>{ui.playerId=el.value;autoTurn();renderPanel()},
  setting:el=>{const k=el.dataset.k;db.settings[k]=el.checked;save();if(ui.stones&&!ui.thrownId&&!ui.broom&&!ui.want)ui.step=stepsFor()[0];if(ui.stones&&k==='types')ui.type=null;if(k==='rot')renderSettings()},
  import:el=>{if(el.files[0])importData(el.files[0]);el.value=''}
};
app.addEventListener('click',e=>{
  const pk=e.target.closest('svg.picker');if(pk)return pickTap(pk,e);
  const b=e.target.closest('[data-act]');if(!b||!app.contains(b))return;const f=ACT[b.dataset.act];if(f)f(b.dataset.v,b,e);
});
app.addEventListener('input',e=>{const k=e.target.dataset.in;if(k&&IN[k])IN[k](e.target)});
app.addEventListener('change',e=>{const k=e.target.dataset.ch;if(k&&CH[k])CH[k](e.target)});

if(curGame())resetShot();
render();
</script>
</body>
</html>
